spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Without these, Hikari's default minimum-idle equals maximum-pool-size,
# meaning it keeps connections open to Neon permanently for as long as the
# app process is alive. Combined with the uptime pinger keeping the app
# warm 24/7, that silently burned through the entire monthly free-tier
# compute-hour quota by holding the database "active" nonstop. These
# settings let the pool shrink to zero connections after a short idle
# period, so Neon's own "scale to zero after 5 minutes" can actually
# trigger between real usage.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
anthropic.api.key=${ANTHROPIC_API_KEY}
server.port=${PORT:8080}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
