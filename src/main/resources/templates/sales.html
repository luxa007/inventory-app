<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Sales | SmartStock AI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .sales-container { max-width: 800px; margin: 30px auto; padding: 20px; }
        .form-card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #374151; }
        .form-group select, .form-group input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        .btn-primary { background: #2563eb; color: white; padding: 10px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; }
        .btn-primary:hover { background: #1d4ed8; }
        .alert-success { background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; padding: 12px; border-radius: 6px; margin-bottom: 16px; }
        .alert-error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 12px; border-radius: 6px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; font-weight: 600; color: #374151; }
        .badge-low { background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="sales-container">
    <h1 style="margin-bottom: 24px; color: #111827;">Record Sale</h1>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <div class="form-card">
        <form method="post" action="/sales">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="productId">Product</label>
                <select name="productId" id="productId" required>
                    <option value="">-- Select a product --</option>
                    <option th:each="product : ${products}"
                            th:value="${product.id}"
                            th:text="${product.name + ' (Stock: ' + product.quantity + ')'}"
                            th:classappend="${product.lowStock} ? 'badge-low' : ''">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" name="quantity" id="quantity" min="1" required placeholder="Enter quantity">
            </div>

            <button type="submit" class="btn-primary">Record Sale</button>
        </form>
    </div>

    <div class="form-card">
        <h2 style="margin-bottom: 16px; color: #111827;">Recent Sales</h2>
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Unit Price</th>
                    <th>Total</th>
                    <th>Sold By</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="sale : ${recentSales}">
                    <td th:text="${sale.product.name}"></td>
                    <td th:text="${sale.quantitySold}"></td>
                    <td th:text="'$' + ${sale.unitPriceAtSale}"></td>
                    <td th:text="'$' + ${sale.totalAmount}"></td>
                    <td th:text="${sale.soldBy}"></td>
                    <td th:text="${#temporals.format(sale.timestamp, 'MMM dd, HH:mm')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentSales)}">
                    <td colspan="6" style="text-align: center; color: #6b7280;">No sales recorded yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
