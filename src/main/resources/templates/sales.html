<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::div.sales-body})}">
<body>
<div class="sales-body">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h2 class="fw-bold mb-1">🛒 Record Sale</h2>
            <p class="text-muted mb-0">Record a sale and automatically update stock levels.</p>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title mb-3">New Sale</h5>
                    <form method="post" action="/sales">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Product</label>
                            <select name="productId" class="form-select" required>
                                <option value="">-- Select a product --</option>
                                <option th:each="product : ${products}"
                                        th:value="${product.id}"
                                        th:text="${product.name + ' (Stock: ' + product.quantity + ')'}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Quantity</label>
                            <input type="number" name="quantity" class="form-control" min="1" required placeholder="Enter quantity">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-cart-check me-1"></i> Record Sale
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="card-title mb-0">Recent Sales</h5>
                        <a href="/sales/history" class="small">View full history →</a>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Product</th>
                                    <th>Qty</th>
                                    <th>Price</th>
                                    <th>Total</th>
                                    <th>By</th>
                                    <th>Time</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="sale : ${recentSales}" th:classappend="${sale.voided} ? 'table-secondary text-muted' : ''">
                                    <td th:text="${sale.product.name}"></td>
                                    <td th:text="${sale.quantitySold}"></td>
                                    <td th:text="'₹' + ${sale.unitPriceAtSale}"></td>
                                    <td th:text="'₹' + ${sale.totalAmount}"></td>
                                    <td th:text="${sale.soldBy}"></td>
                                    <td th:text="${#temporals.format(sale.timestamp, 'MMM dd, HH:mm')}"></td>
                                    <td>
                                        <span th:if="${sale.voided}" class="badge bg-secondary">Voided</span>
                                        <span th:unless="${sale.voided}" class="badge bg-success">Active</span>
                                    </td>
                                    <td>
                                        <form th:unless="${sale.voided}"
                                              th:action="@{/sales/{id}/void(id=${sale.id})}"
                                              method="post"
                                              onsubmit="return confirm('Void this sale? Stock will be restored.')">
                                            <input type="hidden" name="reason" value="Manually voided">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="bi bi-x-circle me-1"></i>Void
                                            </button>
                                        </form>
                                        <span th:if="${sale.voided}" class="text-muted small"
                                              th:text="${sale.voidedBy + ' · ' + #temporals.format(sale.voidedAt, 'MMM dd')}">
                                        </span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(recentSales)}">
                                    <td colspan="8" class="text-center text-muted py-3">No sales recorded yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
